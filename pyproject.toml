[project]
name = "pose-editor"
version = "0.1.0"
description = "A professional double/single human pose editor python GUI utilizing PySide6."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
