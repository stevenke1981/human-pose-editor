<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Mannequin Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1c22; font-family: 'Segoe UI', sans-serif; }
  #info {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    color: #666; font-size: 12px; background: rgba(0,0,0,0.5);
    padding: 4px 14px; border-radius: 12px; pointer-events: none;
    user-select: none; opacity: 0.7;
  }
  #status {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 11px; background: rgba(0,0,0,0.4);
    padding: 3px 12px; border-radius: 8px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">🔄 Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<div id="status">Initializing...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 20;
controls.update();

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
mainLight.position.set(5, 8, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 1024;
mainLight.shadow.mapSize.height = 1024;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.8);
fillLight.position.set(-3, 1, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(0, -2, -5);
scene.add(rimLight);

// --- Ground ---
const gridHelper = new THREE.GridHelper(10, 20, 0x444466, 0x333355);
scene.add(gridHelper);

const groundGeo = new THREE.PlaneGeometry(10, 10);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// --- Scene Contents Container ---
const sceneGroup = new THREE.Group();
scene.add(sceneGroup);

// --- QWebChannel Bridge ---
let bridge = null;
let bridgeReady = false;

// Exposed for Python calls via evaluateJavaScript
window.__threejs_bridge = {
  setBridge: function(obj) {
    bridge = obj;
    bridgeReady = true;
    document.getElementById('status').textContent = 'Bridge connected';
  },
  // Scene manipulation API
  clearScene: function() {
    while(sceneGroup.children.length > 0) {
      const child = sceneGroup.children[0];
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
      sceneGroup.remove(child);
    }
    document.getElementById('status').textContent = 'Scene cleared';
  },
  addMesh: function(jsonStr) {
    try {
      const data = JSON.parse(jsonStr);
      // data: { geometry, material, position, rotation, scale }
      let geo;
      switch(data.geometry?.type) {
        case 'box':
          geo = new THREE.BoxGeometry(...(data.geometry.params || [1,1,1]));
          break;
        case 'sphere':
          geo = new THREE.SphereGeometry(...(data.geometry.params || [0.5, 32, 32]));
          break;
        case 'cylinder':
          geo = new THREE.CylinderGeometry(...(data.geometry.params || [0.5, 0.5, 1, 32]));
          break;
        case 'capsule':
          geo = new THREE.CapsuleGeometry(...(data.geometry.params || [0.3, 0.6, 8, 16]));
          break;
        default:
          geo = new THREE.Group();
      }
      const mat = new THREE.MeshStandardMaterial({
        color: data.material?.color || 0x4488ff,
        roughness: data.material?.roughness ?? 0.4,
        metalness: data.material?.metalness ?? 0.1,
      });
      const mesh = new THREE.Mesh(geo, mat);
      if (data.position) mesh.position.set(...data.position);
      if (data.rotation) mesh.rotation.set(...data.rotation);
      if (data.scale) mesh.scale.set(...data.scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      if (data.name) mesh.name = data.name;
      sceneGroup.add(mesh);
      return 'ok';
    } catch(e) {
      return 'error: ' + e.message;
    }
  },
  setPose: function(jsonStr) {
    // Placeholder for Phase 2: pose the mannequin
    document.getElementById('status').textContent = 'Pose update received';
  },
  loadModelCode: function(codeStr) {
    // Placeholder for Phase 3: evaluate Three.js factory code
    try {
      // In Phase 3, this will execute generated factory code
      document.getElementById('status').textContent = 'Model code loaded';
      return 'ok';
    } catch(e) {
      return 'error: ' + e.message;
    }
  },
  setStatus: function(msg) {
    document.getElementById('status').textContent = msg;
  }
};

// --- QWebChannel Initialization (called after page loads) ---
window.initBridge = function() {
  // This will be called from Python via page().runJavaScript after QWebChannel is set up
  if (typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.__threejs_bridge.setBridge(channel.objects.bridge);
    });
  }
};

// Try loading QWebChannel dynamically if not already loaded
function loadQWebChannel() {
  if (typeof QWebChannel !== 'undefined') {
    window.initBridge();
    return;
  }
  // QWebChannel should be injected by the QWebEnginePage
  // Poll briefly for it
  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    if (typeof QWebChannel !== 'undefined') {
      clearInterval(interval);
      window.initBridge();
    } else if (attempts > 50) {
      clearInterval(interval);
      document.getElementById('status').textContent = 'Bridge not available (running standalone)';
    }
  }, 100);
}

setTimeout(loadQWebChannel, 500);

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// --- Standalone test: show a default mannequin placeholder ---
// Shows a simple cylinder body when no bridge is connected (standalone mode)
setTimeout(() => {
  if (!bridgeReady) {
    document.getElementById('status').textContent = 'Standalone mode · Default scene';
    // Add a simple mannequin placeholder
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16),
      new THREE.MeshStandardMaterial({ color: 0x6688cc, roughness: 0.5, metalness: 0.1 })
    );
    body.position.y = 0.6;
    body.castShadow = true;
    sceneGroup.add(body);
    
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0x88aadd, roughness: 0.4 })
    );
    head.position.y = 1.4;
    head.castShadow = true;
    sceneGroup.add(head);
  }
}, 2000);

console.log('Three.js Viewer initialized');
</script>
</body>
</html>
