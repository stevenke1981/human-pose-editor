<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Mannequin Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1c22; font-family: 'Segoe UI', sans-serif; }
  #info {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 12px; background: rgba(0,0,0,0.5);
    padding: 4px 14px; border-radius: 12px; pointer-events: none;
    user-select: none; opacity: 0.7;
  }
  #status {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 11px; background: rgba(0,0,0,0.4);
    padding: 3px 12px; border-radius: 8px; pointer-events: none;
  }
  #toolbar {
    position: absolute; top: 44px; right: 12px; display: flex; gap: 6px;
    align-items: center; z-index: 10;
  }
  #toolbar button {
    background: rgba(42,45,53,0.85); color: #ccc; border: 1px solid #3e424d;
    border-radius: 5px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(4px);
  }
  #toolbar button:hover { background: rgba(53,57,67,0.9); border-color: #00e5ff; color: #fff; }
</style>
</head>
<body>
<div id="info">🔄 Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<div id="toolbar">
  <button id="btn_gen_prop" title="Generate 3D prop from image">🎲 Generate Prop</button>
  <button id="btn_sculpt" title="Full sculpt pipeline: probe → spec → validate → generate">🔧 Sculpt Pipeline</button>
  <button id="btn_clear_props" title="Remove all props">🗑️ Clear Props</button>
  <span id="prop_count" style="color:#888;font-size:11px;margin-left:8px;"></span>
</div>
<div id="status">Initializing 3D Mannequin...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ======================================================================
//  Scene Setup
// ======================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 20;
controls.update();

// --- Lights ---
scene.add(new THREE.AmbientLight(0x404060, 0.5));
const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
mainLight.position.set(5, 8, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 1024;
mainLight.shadow.mapSize.height = 1024;
scene.add(mainLight);
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.8);
fillLight.position.set(-3, 1, 4);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(0, -2, -5);
scene.add(rimLight);

// --- Ground ---
const gridHelper = new THREE.GridHelper(10, 20, 0x444466, 0x333355);
scene.add(gridHelper);
const groundGeo = new THREE.PlaneGeometry(10, 10);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ======================================================================
//  OpenPose 18-Keypoint Joint Model
// ======================================================================
// Index: Name
// 0: Nose, 1: Neck, 2: RShoulder, 3: RElbow, 4: RWrist
// 5: LShoulder, 6: LElbow, 7: LWrist
// 8: RHip, 9: RKnee, 10: RAnkle
// 11: LHip, 12: LKnee, 13: LAnkle
// 14: REye, 15: LEye, 16: REar, 17: LEar

const JOINT_NAMES = [
  'nose', 'neck', 'rshoulder', 'relbow', 'rwrist',
  'lshoulder', 'lelbow', 'lwrist',
  'rhip', 'rknee', 'rankle',
  'lhip', 'lknee', 'lankle',
  'reye', 'leye', 'rear', 'lear'
];

// Bone connections: pairs of joint indices forming limbs
// Each entry: [parentIdx, childIdx, boneName]
const SKELETON_BONES = [
  [1, 0, 'neck_to_nose'],     // neck → nose
  [1, 2, 'neck_to_rshoulder'], // neck → R shoulder
  [2, 3, 'r_upper_arm'],       // R shoulder → R elbow
  [3, 4, 'r_forearm'],         // R elbow → R wrist
  [1, 5, 'neck_to_lshoulder'], // neck → L shoulder
  [5, 6, 'l_upper_arm'],       // L shoulder → L elbow
  [6, 7, 'l_forearm'],         // L elbow → L wrist
  [1, 8, 'torso_to_rhip'],     // neck → R hip (torso right)
  [8, 9, 'r_thigh'],           // R hip → R knee
  [9, 10, 'r_shin'],           // R knee → R ankle
  [1, 11, 'torso_to_lhip'],    // neck → L hip (torso left)
  [11, 12, 'l_thigh'],         // L hip → L knee
  [12, 13, 'l_shin'],          // L knee → L ankle
  [0, 14, 'nose_to_reye'],     // nose → R eye
  [14, 16, 'reye_to_rear'],    // R eye → R ear
  [0, 15, 'nose_to_leye'],     // nose → L eye
  [15, 17, 'leye_to_lear'],    // L eye → L ear
  [16, 2, 'rear_to_rshoulder'],// R ear → R shoulder
  [17, 5, 'lear_to_lshoulder'],// L ear → L shoulder
];

// Joint pairs for building body part meshes (wider than bones)
// [parentJointIdx, childJointIdx, partName, radius]
const BODY_PARTS = [
  [8, 11, 'hips',      0.22],   // between hips (pelvis)
  [11, 1, 'torso_l',   0.18],   // L hip → neck
  [8, 1, 'torso_r',    0.18],   // R hip → neck
  [2, 3, 'r_arm_up',   0.10],   // R upper arm
  [3, 4, 'r_arm_lo',   0.08],   // R forearm
  [5, 6, 'l_arm_up',   0.10],   // L upper arm
  [6, 7, 'l_arm_lo',   0.08],   // L forearm
  [8, 9, 'r_leg_up',   0.14],   // R thigh
  [9, 10, 'r_leg_lo',  0.11],   // R shin
  [11, 12, 'l_leg_up', 0.14],   // L thigh
  [12, 13, 'l_leg_lo', 0.11],   // L shin
];

// ======================================================================
//  3D Mannequin Construction
// ======================================================================

const mannequinRoot = new THREE.Group();
mannequinRoot.name = 'mannequin';
scene.add(mannequinRoot);

// --- Props container (generated 3D objects) ---
const propsGroup = new THREE.Group();
propsGroup.name = 'props';
scene.add(propsGroup);

// Track loaded prop names
const loadedProps = [];

// --- Joint markers (visual debug, can be hidden) ---
const jointMarkers = [];
const jointMarkersGroup = new THREE.Group();
jointMarkersGroup.visible = false; // hidden by default
mannequinRoot.add(jointMarkersGroup);

// --- Body part meshes ---
const bodyParts = []; // { boneName, parentIdx, childIdx, mesh }
const bodyGroup = new THREE.Group();
mannequinRoot.add(bodyGroup);

// Shared material cache for body parts
const SKIN_COLOR = 0x88aadd;
const JOINT_COLOR = 0x66bbff;

function createCapsuleBetweenPoints(p1, p2, radius, color = SKIN_COLOR) {
  const p1v = new THREE.Vector3(p1[0], p1[1], p1[2]);
  const p2v = new THREE.Vector3(p2[0], p2[1], p2[2]);
  const direction = new THREE.Vector3().copy(p2v).sub(p1v);
  const length = direction.length();
  if (length < 0.001) return null;
  direction.normalize();

  const mid = new THREE.Vector3().copy(p1v).add(p2v).multiplyScalar(0.5);
  const geo = new THREE.CapsuleGeometry(radius, length * 0.5, 8, 12);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.5,
    metalness: 0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(mid);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Orient capsule along direction
  const up = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, direction);
  mesh.quaternion.copy(quat);

  return mesh;
}

function createSphere(pos, radius, color = JOINT_COLOR) {
  const geo = new THREE.SphereGeometry(radius, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.4,
    metalness: 0.1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.castShadow = true;
  return mesh;
}

// --- Head mesh (special, attached to nose position) ---
let headMesh = null;
function createHead() {
  const geo = new THREE.SphereGeometry(0.22, 24, 24);
  // Slightly elongated for a more natural head shape
  const mat = new THREE.MeshStandardMaterial({
    color: SKIN_COLOR,
    roughness: 0.4,
    metalness: 0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(1, 1.15, 0.9);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ======================================================================
//  Pose Update Engine
// ======================================================================

// Current joint positions in 3D (computed from 2D keypoints)
const jointPos3D = new Array(18).fill(null).map(() => new THREE.Vector3());

// Reference T-pose keypoints (for computing rotations when no pose data)
const defaultKeypoints = [
  [256, 180],  // 0: nose
  [256, 200],  // 1: neck
  [306, 200],  // 2: rshoulder
  [330, 240],  // 3: relbow
  [350, 270],  // 4: rwrist
  [206, 200],  // 5: lshoulder
  [182, 240],  // 6: lelbow
  [162, 270],  // 7: lwrist
  [286, 310],  // 8: rhip
  [286, 370],  // 9: rknee
  [286, 420],  // 10: rankle
  [226, 310],  // 11: lhip
  [226, 370],  // 12: lknee
  [226, 420],  // 13: lankle
  [266, 178],  // 14: reye
  [246, 178],  // 15: leye
  [270, 178],  // 16: rear
  [242, 178],  // 17: lear
];

// Scale mapping from 2D canvas coords (512x512) to 3D scene units
// 3D scene: 1 unit ≈ 1 meter. Mannequin height ~1.7 units.
const SCALE_3D = 1.7 / 420; // 420px ≈ 1.7m height from hip to top of head

function keypointsTo3D(keypoints, prevPositions) {
  // keypoints: array of 18 [x, y, confidence] or [x, y]
  // Convert 2D canvas coords to 3D positions with depth estimation

  const kps = keypoints.map(kp => {
    if (kp.length >= 3) return { x: kp[0], y: kp[1], c: kp[2] };
    return { x: kp[0], y: kp[1], c: 1.0 };
  });

  // Step 1: Compute reference body center and scale
  const neck = kps[1];
  const rHip = kps[8];
  const lHip = kps[11];

  // Average hip center
  let hipCenterX, hipCenterY;
  if (rHip.c > 0.1 && lHip.c > 0.1) {
    hipCenterX = (rHip.x + lHip.x) / 2;
    hipCenterY = (rHip.y + lHip.y) / 2;
  } else if (rHip.c > 0.1) {
    hipCenterX = rHip.x;
    hipCenterY = rHip.y;
  } else if (lHip.c > 0.1) {
    hipCenterX = lHip.x;
    hipCenterY = lHip.y;
  } else {
    hipCenterX = neck.x;
    hipCenterY = neck.y + 100;
  }

  const bodyCenterX = (neck.x + hipCenterX) / 2;
  const bodyHeight = Math.abs(neck.y - hipCenterY) || 200;

  // Step 2: Estimate depth (z) for each joint
  // Body twist: difference between shoulder and hip centers
  const shoulderCenterX = neck.x;
  const twistAmount = (shoulderCenterX - hipCenterX) * 0.3;

  function estimateZ(idx, baseZ) {
    const kp = kps[idx];
    if (kp.c < 0.1) return prevPositions[idx]?.z || 0;

    // Left/right joints get depth from body asymmetry
    // Right side joints (even, but check specific indices)
    const isRightSide = [2, 3, 4, 8, 9, 10, 14, 16].includes(idx);
    const isLeftSide = [5, 6, 7, 11, 12, 13, 15, 17].includes(idx);

    if (isRightSide) {
      return twistAmount * 0.3 + 0.05;
    } else if (isLeftSide) {
      return twistAmount * 0.3 - 0.05;
    }

    // Arm reach forward (z offset when arm extends forward)
    if ([3, 4, 6, 7].includes(idx)) {
      const parentIdx = [3, 4].includes(idx) ? 2 : 5;
      const grandParent = [3, 4].includes(idx) ? 1 : 1;
      if (kps[parentIdx]?.c > 0.1 && kps[grandParent]?.c > 0.1) {
        const armDir = kp.x - kps[parentIdx].x;
        const parentDir = kps[parentIdx].x - kps[grandParent].x;
        // If arm extends away from body center, push forward in z
        if (Math.abs(armDir) > Math.abs(parentDir) * 0.5) {
          return armDir * 0.15;
        }
      }
    }

    // Arms crossing body midline → front
    if ([4, 7].includes(idx) && kp.c > 0.1) {
      const bodyCenterXLocal = shoulderCenterX;
      if (Math.abs(kp.x - bodyCenterXLocal) < 20) {
        return 0.15; // arm reaching across body
      }
    }

    return baseZ || 0;
  }

  // Step 3: Convert to 3D
  const positions = [];
  for (let i = 0; i < 18; i++) {
    const kp = kps[i];
    if (kp.c < 0.001) {
      // Joint not visible: use previous position if available
      if (prevPositions[i]) {
        positions.push(prevPositions[i].clone());
      } else {
        // Fall back to default T-pose
        const def = defaultKeypoints[i];
        const x3d = (def[0] - 256) * SCALE_3D;
        const y3d = -(def[1] - 310) * SCALE_3D;
        positions.push(new THREE.Vector3(x3d, y3d, estimateZ(i, 0)));
      }
      continue;
    }

    // Map canvas coords to 3D: center at (256, 310) which is hip level
    const x3d = (kp.x - 256) * SCALE_3D;
    const y3d = -(kp.y - 310) * SCALE_3D; // Y up in Three.js
    const z3d = estimateZ(i, 0);

    positions.push(new THREE.Vector3(x3d, y3d, z3d));
  }

  return positions;
}

// ======================================================================
//  Build/Update Mannequin Meshes
// ======================================================================

function buildMannequin(positions) {
  // Clear previous
  while (bodyGroup.children.length > 0) {
    const c = bodyGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    bodyGroup.remove(c);
  }
  bodyParts.length = 0;

  // Build body part capsules
  const added = new Set();
  for (const [pIdx, cIdx, name, radius] of BODY_PARTS) {
    const p1 = positions[pIdx];
    const p2 = positions[cIdx];
    if (!p1 || !p2) continue;

    const mesh = createCapsuleBetweenPoints(
      [p1.x, p1.y, p1.z], [p2.x, p2.y, p2.z],
      radius, SKIN_COLOR
    );
    if (mesh) {
      mesh.name = name;
      bodyGroup.add(mesh);
      bodyParts.push({ name, parentIdx: pIdx, childIdx: cIdx, mesh });
    }
    added.add(`${pIdx}-${cIdx}`);
  }

  // Head (at nose position, offset slightly for neck)
  const nosePos = positions[0];
  if (nosePos) {
    if (headMesh) {
      headMesh.position.copy(nosePos);
      headMesh.position.y += 0.12; // head sits above nose
    } else {
      headMesh = createHead();
      headMesh.position.copy(nosePos);
      headMesh.position.y += 0.12;
      bodyGroup.add(headMesh);
    }
  }

  // Neck capsule (from neck pos up to head base)
  const neckPos = positions[1];
  if (neckPos && nosePos) {
    const neckMesh = createCapsuleBetweenPoints(
      [neckPos.x, neckPos.y, neckPos.z],
      [nosePos.x, nosePos.y - 0.05, nosePos.z],
      0.12, SKIN_COLOR
    );
    if (neckMesh) {
      neckMesh.name = 'neck';
      bodyGroup.add(neckMesh);
    }
  }

  // Joint markers (small spheres at each joint)
  for (let i = 0; i < 18; i++) {
    const pos = positions[i];
    if (!pos) continue;
    const marker = createSphere([pos.x, pos.y, pos.z], 0.04, JOINT_COLOR);
    marker.name = `joint_${i}`;
    jointMarkersGroup.add(marker);
    jointMarkers.push(marker);
  }
}

function updateMannequin(positions) {
  // Update body part meshes (recreate with new positions)
  // A more optimized approach would use matrix updates, but for Phase 2
  // we rebuild the capsules for simplicity and correctness

  // Clear and rebuild
  for (const part of bodyParts) {
    if (part.mesh.parent) {
      part.mesh.parent.remove(part.mesh);
    }
    if (part.mesh.geometry) part.mesh.geometry.dispose();
    if (part.mesh.material) part.mesh.material.dispose();
  }
  bodyParts.length = 0;

  // Rebuild body part capsules
  for (const [pIdx, cIdx, name, radius] of BODY_PARTS) {
    const p1 = positions[pIdx];
    const p2 = positions[cIdx];
    if (!p1 || !p2) continue;

    const mesh = createCapsuleBetweenPoints(
      [p1.x, p1.y, p1.z], [p2.x, p2.y, p2.z],
      radius, SKIN_COLOR
    );
    if (mesh) {
      mesh.name = name;
      bodyGroup.add(mesh);
      bodyParts.push({ name, parentIdx: pIdx, childIdx: cIdx, mesh });
    }
  }

  // Update head
  const nosePos = positions[0];
  if (headMesh && nosePos) {
    headMesh.position.copy(nosePos);
    headMesh.position.y += 0.12;
  }

  // Update neck
  const neckPos = positions[1];
  if (neckPos && nosePos) {
    const neckMesh = createCapsuleBetweenPoints(
      [neckPos.x, neckPos.y, neckPos.z],
      [nosePos.x, nosePos.y - 0.05, nosePos.z],
      0.12, SKIN_COLOR
    );
    if (neckMesh) {
      neckMesh.name = 'neck';
      bodyGroup.add(neckMesh);
    }
  }

  // Update joint markers
  while (jointMarkersGroup.children.length > 0) {
    const c = jointMarkersGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    jointMarkersGroup.remove(c);
  }
  jointMarkers.length = 0;

  for (let i = 0; i < 18; i++) {
    const pos = positions[i];
    if (!pos) continue;
    const marker = createSphere([pos.x, pos.y, pos.z], 0.04, JOINT_COLOR);
    marker.name = `joint_${i}`;
    jointMarkersGroup.add(marker);
    jointMarkers.push(marker);
  }
}

// ======================================================================
//  Public API (called from Python via bridge)
// ======================================================================

let currentPositions = null;

// Build default T-pose mannequin
function initializeDefaultPose() {
  const pos = keypointsTo3D(defaultKeypoints, []);
  currentPositions = pos;
  buildMannequin(pos);
  document.getElementById('status').textContent = 'Default pose loaded';
}

function updatePoseFromKeypoints(keypoints) {
  // keypoints: array of 18 [x, y, confidence] or {x, y, c} objects
  // where x, y are in 512x512 canvas coords or normalized

  if (!keypoints || keypoints.length < 18) {
    return;
  }

  const pos = keypointsTo3D(keypoints, currentPositions);
  currentPositions = pos;

  if (bodyParts.length === 0) {
    buildMannequin(pos);
  } else {
    updateMannequin(pos);
  }

  document.getElementById('status').textContent = 'Pose synced';
}

// ======================================================================
//  QWebChannel Bridge
// ======================================================================

let bridgeReady = false;

window.__threejs_bridge = {
  // Initialize with default pose
  init: function() {
    initializeDefaultPose();
    bridgeReady = true;
    this._setupToolbar();
  },

  // Internal: wire toolbar buttons
  _setupToolbar: function() {
    const btnGen = document.getElementById('btn_gen_prop');
    const btnClear = document.getElementById('btn_clear_props');
    const countSpan = document.getElementById('prop_count');

    btnGen.addEventListener('click', () => {
      document.getElementById('status').textContent = 'Requesting prop generation...';
      if (typeof qt !== 'undefined' && qt.webChannelTransport) {
        if (window.__python_bridge && window.__python_bridge.on_generate_prop) {
          window.__python_bridge.on_generate_prop();
        } else {
          document.getElementById('status').textContent = 'Bridge not ready for prop generation';
        }
      } else {
        document.getElementById('status').textContent = 'Standalone: cannot generate (no Python bridge)';
      }
    });

    const btnSculpt = document.getElementById('btn_sculpt');
    btnSculpt.addEventListener('click', () => {
      document.getElementById('status').textContent = '🔧 Starting sculpt pipeline...';
      if (typeof qt !== 'undefined' && qt.webChannelTransport) {
        if (window.__python_bridge && window.__python_bridge.on_sculpt_pipeline) {
          window.__python_bridge.on_sculpt_pipeline();
        } else {
          // Direct bridge call
          const bridge = channel?.objects?.bridge;
          if (bridge && bridge.on_sculpt_pipeline_requested) {
            bridge.on_sculpt_pipeline_requested();
          } else {
            document.getElementById('status').textContent = 'Standalone: no Python bridge for sculpt pipeline';
          }
        }
      } else {
        document.getElementById('status').textContent = 'Standalone: sculpt pipeline requires Python';
      }
    });

    btnClear.addEventListener('click', () => {
      window.__threejs_bridge.clearProps();
    });

    // Update prop count periodically
    setInterval(() => {
      if (countSpan) {
        countSpan.textContent = loadedProps.length > 0 ? `${loadedProps.length} prop(s)` : '';
      }
    }, 1000);
  },

  // Called by Python: setPose(poseData)
  setPose: function(jsonStr) {
    try {
      const data = JSON.parse(jsonStr);
      if (data.points) {
        updatePoseFromKeypoints(data.points);
      } else if (data.keypoints) {
        updatePoseFromKeypoints(data.keypoints);
      }
      return 'ok';
    } catch(e) {
      return 'error: ' + e.message;
    }
  },

  clearScene: function() {
    while (bodyGroup.children.length > 0) {
      const c = bodyGroup.children[0];
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
      bodyGroup.remove(c);
    }
    bodyParts.length = 0;
    if (headMesh) {
      bodyGroup.remove(headMesh);
      headMesh = null;
    }
    this.clearProps();
    initializeDefaultPose();
    return 'ok';
  },

  // Load generated Three.js factory code and add it to the scene
  loadModelCode: function(codeStr) {
    try {
      // codeStr is a JS function like: function createPropName() { ... return group; }
      // Evaluate it and call it to get the THREE.Group
      const createFn = new Function('THREE', '"use strict"; ' + codeStr + '; return create' + codeStr.match(/function create(\w+)/)?.[1] || 'GeneratedProp' + ';')();
      if (typeof createFn !== 'function') {
        return 'error: generated code does not export a factory function';
      }
      const group = createFn();
      if (!group || !group.isObject3D) {
        return 'error: factory did not return a valid Object3D';
      }
      propsGroup.add(group);
      const name = group.name || 'prop_' + loadedProps.length;
      loadedProps.push(name);
      document.getElementById('status').textContent = 'Loaded: ' + name;
      return 'ok:' + name;
    } catch(e) {
      return 'error: ' + e.message;
    }
  },

  // Evaluate raw JS (used for the prop generator output)
  evalScript: function(jsStr) {
    try {
      const result = eval(jsStr);
      return 'ok';
    } catch(e) {
      return 'error: ' + e.message;
    }
  },

  // Add a prop from pre-evaluated JS (alternative path)
  addPropFromCode: function(codeStr) {
    // codeStr is the complete JS including the factory function
    // We eval the code to define the function, then call it
    try {
      eval(codeStr);
      // The code defines a function like createPropName() 
      // Find the function name
      const match = codeStr.match(/function\s+(create\w+)/);
      if (!match) return 'error: no factory function found';
      const fnName = match[1];
      const fn = eval(fnName);
      if (typeof fn !== 'function') return 'error: factory not a function';
      const group = fn();
      if (!group || !group.isObject3D) return 'error: invalid Object3D';
      propsGroup.add(group);
      const name = group.name || fnName.replace('create', '');
      loadedProps.push(name);
      document.getElementById('status').textContent = 'Prop loaded: ' + name;
      return 'ok';
    } catch(e) {
      return 'error: ' + e.message;
    }
  },

  // Remove all props
  clearProps: function() {
    while (propsGroup.children.length > 0) {
      const c = propsGroup.children[0];
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
      propsGroup.remove(c);
    }
    loadedProps.length = 0;
    document.getElementById('status').textContent = 'Props cleared';
  },

  // List loaded prop names
  getPropList: function() {
    return JSON.stringify(loadedProps);
  },

  setStatus: function(msg) {
    document.getElementById('status').textContent = msg;
  },

  toggleJoints: function(visible) {
    jointMarkersGroup.visible = visible;
  },

  getScreenshotInfo: function() {
    return JSON.stringify({
      cameraPos: [camera.position.x, camera.position.y, camera.position.z],
      target: [controls.target.x, controls.target.y, controls.target.z],
    });
  }
};

// ======================================================================
//  QWebChannel Initialization
// ======================================================================

let g_pythonBridge = null;

function setupBridge() {
  if (typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.__threejs_bridge.init();
      g_pythonBridge = channel.objects.bridge;
      window.__python_bridge = g_pythonBridge;
      if (g_pythonBridge && g_pythonBridge.on_scene_ready) {
        g_pythonBridge.on_scene_ready('ready');
      }
    });
  } else {
    // Standalone mode: init default pose
    setTimeout(() => {
      initializeDefaultPose();
      document.getElementById('status').textContent = 'Standalone mode · Default mannequin';
    }, 500);
  }
}

// Poll for QWebChannel
let attempts = 0;
const interval = setInterval(() => {
  attempts++;
  if (typeof QWebChannel !== 'undefined') {
    clearInterval(interval);
    setupBridge();
  } else if (attempts > 60) {
    clearInterval(interval);
    setupBridge(); // Will fall through to standalone
  }
}, 100);

// ======================================================================
//  Resize & Animation
// ======================================================================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

console.log('3D Mannequin Viewer initialized');
</script>
